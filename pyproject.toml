[project]
name = "followthrough"
version = "0.1.0"
license = "MIT"
description = "Durable follow-up checks for changes shipped with coding agents: every check survives the session and reaches a verdict or an explicit close."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
followthrough = "followthrough.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/followthrough"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
